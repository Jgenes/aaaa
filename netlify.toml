[build]
  command = "npm run build"
  publish = "dist"

# Serve the React app for deep links so refreshing a client-side route (for
# example /course/123 or /learning) loads the SPA instead of a host 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_OPTIONS = "--max_old_space_size=4096"

